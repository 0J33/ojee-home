<!DOCTYPE html>
<!--
  ojee-home standalone shell, on ojee-ui v3.

  Mounted in ojee.console this page is never requested: the console supplies
  chrome, ojee-ui3.css and the icon sprite. Run on its own, this is the whole
  shell: the wordmark, the v3 stylesheet and sprite vendored next to it, and
  the module mounted through chrome.js's ModuleHost exactly as the console
  mounts it. Tailnet only; no auth here by design.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a">
<title>Home · ojee</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="ojee-ui3.css">
<style>
  body{background:var(--page);margin:0;min-height:100dvh}
  .sa-top{display:flex;align-items:center;gap:8px;height:52px;padding:0 16px;border-bottom:1px solid var(--line)}
  .sa-top .wm{margin-right:auto}
  #toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:90;display:grid;gap:8px;width:min(380px,calc(100% - 32px))}
</style>
</head>
<body>
<div class="ui3-root">
  <header class="sa-top"><span class="wm">ojee<b>.</b><span>home</span></span><span class="tag">standalone</span></header>
  <main id="view"></main>
</div>
<div id="toasts" aria-live="polite"></div>
<script type="module">
import { ModuleHost, onRoute } from './chrome.js';
import { ensureSprite } from './ojee-ui3.js';

await ensureSprite('icons3.svg');
const host = new ModuleHost({ el: document.getElementById('view'), base: '' });
const manifest = await (await fetch('module.json')).json();
let mounted = false;
onRoute(async ({ a }) => {
  const view = a || manifest.views?.[0]?.id || 'overview';
  if (!mounted) { mounted = true; await host.mount(manifest, view, new URL(manifest.ui, location.href).href); }
  else await host.setView(view);
});
</script>
</body>
</html>
